<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shooting Game</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.17.3/rapier.es.js",
          "firebase/app": "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        color: #eef3ff;
        background: #111722;
        font-family: system-ui, sans-serif;
      }

      #game-canvas {
        position: fixed;
        inset: 0;
      }

      #target-ring-ui {
        position: fixed;
        top: calc(50% + 10vh);
        left: calc(50% + 22vw);
        z-index: 2;
        width: min(28vmin, 220px);
        transform: translate(-50%, -50%);
        pointer-events: none;
        user-select: none;
      }

      #target-ring-image {
        display: block;
        width: 100%;
        height: auto;
      }

      #target-ring-trace-area {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        touch-action: none;
        cursor: crosshair;
      }

      #shoot-button {
        position: fixed;
        top: calc(50% + 16vh);
        left: calc(50% - 16vw);
        z-index: 3;
        width: min(18vmin, 140px);
        padding: 0;
        border: 0;
        background: transparent;
        transform: translate(-50%, -50%);
        cursor: pointer;
        user-select: none;
      }

      #shoot-button:disabled {
        cursor: not-allowed;
        opacity: 0.72;
      }

      #shoot-button:focus-visible {
        outline: 3px solid #9bd1ff;
        outline-offset: 0.35rem;
      }

      #shoot-button-image {
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
      }

      #cooldown-gauge {
        position: fixed;
        top: calc(50% + 27vh);
        left: calc(50% - 16vw);
        z-index: 3;
        width: min(24vmin, 180px);
        height: 1rem;
        overflow: hidden;
        border: 2px solid rgb(60 60 60 / 80%);
        border-radius: 999px;
        background: #ffffff;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      #cooldown-gauge-fill {
        width: 100%;
        height: 100%;
        background: #808080;
        transform: scaleX(1);
        transform-origin: left center;
        transition: transform 0.05s linear;
      }

      main,
      footer {
        position: relative;
        z-index: 1;
        width: fit-content;
        margin: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: rgb(9 13 22 / 72%);
        backdrop-filter: blur(6px);
      }

      h1 {
        margin-block: 0 0.5rem;
      }

      p {
        margin: 0;
      }

      footer {
        position: fixed;
        bottom: 0;
      }

      a {
        color: #9bd1ff;
      }

      #stream-controls {
        margin-top: 0.75rem;
        display: grid;
        gap: 0.5rem;
        max-width: min(90vw, 520px);
      }

      #stream-controls h2 {
        margin: 0;
        font-size: 1rem;
      }

      #stream-controls label {
        display: grid;
        gap: 0.25rem;
        font-size: 0.85rem;
      }

      #stream-controls input,
      #stream-controls button {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="game-canvas" aria-label="3D game view"></div>
    <div id="target-ring-ui" aria-label="リングのなぞれる場所">
      <img id="target-ring-image" src="./image/ring.png" alt="Target ring" draggable="false" />
      <div id="target-ring-trace-area" aria-label="リングの当たり判定"></div>
    </div>
    <button id="shoot-button" type="button" aria-label="撃つ">
      <img id="shoot-button-image" src="./image/shoot.png" alt="" draggable="false" />
    </button>
    <div id="cooldown-gauge" aria-label="ショットのクールダウン">
      <div id="cooldown-gauge-fill"></div>
    </div>
    <main>
      <h1>Shooting Game</h1>

    <section id="stream-controls" aria-label="画面共有設定">
      <h2>画面共有（WebRTC / Firebase）</h2>
      <label>
        共有先セッションID
        <input id="stream-session-id" type="text" placeholder="例: booth-01" />
      </label>
      <button id="start-stream" type="button">画面共有を開始</button>
      <p id="stream-status">未接続</p>
    </section>

      <p id="status">three.js と Rapier Physics を読み込み中...</p>
    </main>
    <footer>
      <small>
        Libraries: three.js (MIT License), Rapier Physics (Apache License 2.0).
        詳細は <a href="./THIRD_PARTY_NOTICES.md">Third-Party Notices</a> を参照してください。
      </small>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="学校発表向けの縁日風3D景品体験です。" />
    <title>School Fair Prize Booth</title>
    <!--
      Vite replaces these package imports in production builds. The import map also
      lets an unbuilt checkout run when index.html is served by a static HTTP server.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
          "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.17.3/rapier.es.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        color: #eef3ff;
        background: #111722;
        font-family: system-ui, sans-serif;
      }

      #booth-canvas {
        position: fixed;
        inset: 0;
      }

      #target-ring-ui {
        position: fixed;
        top: calc(50% + 10vh);
        left: calc(50% + 22vw);
        z-index: 2;
        width: min(28vmin, 220px);
        transform: translate(-50%, -50%);
        pointer-events: none;
        user-select: none;
      }

      #target-ring-image {
        display: block;
        width: 100%;
        height: auto;
      }

      #target-ring-trace-area {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        touch-action: none;
        cursor: crosshair;
      }

      #action-button {
        position: fixed;
        top: calc(50% + 16vh);
        left: calc(50% - 16vw);
        z-index: 3;
        width: min(18vmin, 140px);
        padding: 0;
        border: 0;
        background: transparent;
        transform: translate(-50%, -50%);
        cursor: pointer;
        user-select: none;
      }

      #action-button:disabled {
        cursor: not-allowed;
        opacity: 0.72;
      }

      #action-button:focus-visible {
        outline: 3px solid #9bd1ff;
        outline-offset: 0.35rem;
      }

      #action-button-image {
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
      }

      #cooldown-gauge {
        position: fixed;
        top: calc(50% + 27vh);
        left: calc(50% - 16vw);
        z-index: 3;
        width: min(24vmin, 180px);
        height: 1rem;
        overflow: hidden;
        border: 2px solid rgb(60 60 60 / 80%);
        border-radius: 999px;
        background: #ffffff;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      #loading-status {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: rgb(9 13 22 / 88%);
        text-align: center;
      }

      #loading-status[hidden] {
        display: none;
      }

      #loading-status-panel {
        max-width: 30rem;
        padding: 1rem 1.25rem;
        border: 1px solid rgb(155 209 255 / 45%);
        border-radius: 0.75rem;
        background: rgb(17 23 34 / 95%);
      }

      #reload-button {
        margin-top: 0.75rem;
        padding: 0.55rem 1rem;
        border: 1px solid #9bd1ff;
        border-radius: 999px;
        color: #111722;
        background: #9bd1ff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      #cooldown-gauge-fill {
        width: 100%;
        height: 100%;
        background: #808080;
        transform: scaleX(1);
        transform-origin: left center;
        transition: transform 0.05s linear;
      }

      footer {
        position: fixed;
        bottom: 0;
        z-index: 1;
        width: fit-content;
        margin: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: rgb(9 13 22 / 72%);
        backdrop-filter: blur(6px);
      }

      a {
        color: #9bd1ff;
      }

    </style>
  </head>
  <body>
    <div id="loading-status" role="status" aria-live="polite">
      <div id="loading-status-panel">
        <div id="loading-status-message">ゲームを準備しています…</div>
        <button id="reload-button" type="button" hidden>もう一度読み込む</button>
      </div>
    </div>
    <div id="booth-canvas" aria-label="3D school fair booth view"></div>
    <div id="target-ring-ui" aria-label="リングのなぞれる場所">
      <img id="target-ring-image" src="./image/ring.png" alt="Target ring" draggable="false" />
      <div id="target-ring-trace-area" aria-label="リングの当たり判定"></div>
    </div>
    <button id="action-button" type="button" aria-label="チャレンジ">
      <img id="action-button-image" src="./image/action.png" alt="" draggable="false" />
    </button>
    <div id="cooldown-gauge" aria-label="チャレンジの待ち時間">
      <div id="cooldown-gauge-fill"></div>
    </div>
    <footer>
      <small>
        Libraries: three.js (MIT License), Rapier Physics (Apache License 2.0).
        詳細は <a href="./THIRD_PARTY_NOTICES.md">Third-Party Notices</a> を参照してください。
      </small>
    </footer>
  </body>
</html>
